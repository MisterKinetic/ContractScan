services:

  # PostgreSQL with PGVector extension (correct maintained image)
  db:
    image: pgvector/pgvector:pg16
    container_name: contractscan-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: contractscan
      POSTGRES_USER: contractscan
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: contractscan-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — local S3 replacement (simpler than LocalStack, fully S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: contractscan-minio
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console (open http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
