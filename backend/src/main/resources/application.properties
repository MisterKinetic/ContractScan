spring.application.name=backend
# App
spring.application.name=contractscan-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/contractscan
spring.datasource.username=contractscan
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# File upload size limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.com.contractscan=DEBUG

management.endpoints.web.exposure.include=health,info

# Python worker path (override with environment variable in production)
ai.worker.path=${AI_WORKER_PATH:../ai-worker}

# App environment
app.environment=${APP_ENV:development}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Allow the session cookie to be sent back to the frontend
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Set to false for local HTTP development; set to true later for Production HTTPS
server.servlet.session.cookie.secure=false

# Support for Vite Proxy / Forwarded Headers

